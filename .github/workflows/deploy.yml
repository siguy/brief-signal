name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Nothing ran the test suite before this: not CI, not generate-weekly.sh.
      # The tests existed and passed, but no gate enforced that — a broken lint
      # rule or KB parser could reach main unnoticed. It runs before the build
      # so a failure blocks the deploy rather than shipping past it.
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /brief-signal

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Check for new audio
        id: check-audio
        run: |
          if git diff HEAD~1 --name-status --diff-filter=A | grep -q '^A.*content/audio/.*\.mp3$'; then
            echo "new_audio=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify subscribers via Buttondown
        if: steps.check-audio.outputs.new_audio == 'true'
        run: node scripts/send-email.js
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
